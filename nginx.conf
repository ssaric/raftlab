# Compression.
#
# The build writes .br and .gz siblings for every compressible asset, so the
# *_static directives below are what actually serve traffic: compressed once at
# maximum quality instead of on every request. This matters more than it looks.
# Brotli at a quality cheap enough to run per request (4) produces larger files
# than plain gzip -- 77.1 KB against 74.9 KB on 400 KB of real JavaScript --
# while precompressed quality 11 reaches 63.2 KB for no per-request cost.
#
# The on-the-fly settings remain only as a fallback for anything without a
# precompressed sibling, which is to say files under 256 bytes.
#
# This file is included inside the image's `http` block, which already sets
# `gzip on`, `brotli on` and `brotli_static on`. nginx rejects a duplicate
# directive in the same context, so those three are deliberately absent here --
# only `gzip_static` and the tuning parameters belong to us.
gzip_static on;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

brotli_comp_level 6;
brotli_min_length 256;
brotli_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;

# security headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/index.html /index.html =404;
  }

  location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
    expires 30d;
    add_header Pragma public;
    add_header Cache-Control "public";
  }
  location ~* \.(css|js)$ {
    add_header Pragma public;
    add_header Cache-Control "public";
    expires 7d;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
